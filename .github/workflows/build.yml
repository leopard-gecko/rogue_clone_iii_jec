name: Build Rogue Clone III JEC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15-intel, name: macos-intel }
          - { os: macos-15, name: macos-arm64 }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev

      - name: Build
        run: |
          make
          mkdir -p dist
          cp rogue-clone dist/
          make clean
          make PROGRAM=rogue-clone_original SAVEFILE=rogue-clone.save SCOREFILE=rogue-clone.scores original
          cp rogue-clone_original dist/

      - uses: actions/upload-artifact@v6
        with:
          name: rogue-clone-${{ matrix.name }}
          path: dist/

  windows:
    runs-on: windows-2025

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pdcurses

      - name: Build Windows distribution
        run: |
          set -eu
          make dist.win
          mkdir -p dist
          unzip -q rogue_clone-iii.jec.005_win.zip -d dist
          for filename in rogue-c.exe rogue-c_original.exe README_ja.txt README_en.txt LICENSE.txt; do
            test -f "dist/Rogue Clone III/$filename"
          done
          test "$(find 'dist/Rogue Clone III' -maxdepth 1 -type f | wc -l)" -eq 5
          test -z "$(find dist -type f -iname '*.zip' -print -quit)"
          objdump -p 'dist/Rogue Clone III/rogue-c.exe' | grep 'DLL Name:' || true

      # upload-artifact creates its own ZIP. Upload the extracted directory,
      # not rogue_clone-iii.jec.005_win.zip, to avoid a ZIP inside a ZIP.
      - uses: actions/upload-artifact@v6
        with:
          name: rogue-clone-windows-x64
          path: dist/
          if-no-files-found: error
